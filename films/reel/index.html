<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>reel</title>
<style>
  @font-face { font-family: 'Disp'; src: url('../../assets/fonts/inter/InterVariable.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'UI'; src: url('../../assets/fonts/inter/InterVariable.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; background: #111; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #111; }
  #stage > canvas, #dom { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #dom { overflow: hidden; }
  .scene { position: absolute; inset: 0; display: none; }
  .line { position: absolute; left: 0; top: 0; white-space: pre; line-height: 1; font-family: 'Disp'; font-kerning: normal; }
  .g, .gi { display: inline-block; }
  .gi { transform-origin: 0 50%; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="under" width="1080" height="1920"></canvas>
  <div id="dom"></div>
  <canvas id="over" width="1080" height="1920"></canvas>
</div>
<script type="module" src="./reel.js"></script>
</body>
</html>
